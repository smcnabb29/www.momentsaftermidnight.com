<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moments After Midnight Con | New Orleans, Oct 28–30, 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --vault:#140004;
  --oxblood:#4a0009;
  --blood:#8a0010;
  --crimson:#c4001c;
  --fresh:#e3102e;
  --bone:#ecdcc8;
  --ash:#a8968a;
  --line:rgba(196,0,28,.45);
  --display:"Pirata One","UnifrakturCook","Old English Text MT",Georgia,serif;
  --body:"IM Fell English",Garamond,"Times New Roman",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--black:#000000;--bone:#ecdcc8}}
:root[data-theme="dark"]{--black:#000000;--bone:#ecdcc8}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--black)}
body{margin:0;background:var(--black);color:var(--bone);font-family:var(--body);font-size:1.15rem;line-height:1.65;overflow-x:hidden}
body.locked{overflow:hidden}
img,svg{max-width:100%}
a{color:var(--fresh)}
a:hover{color:var(--bone)}
:focus-visible{outline:2px solid var(--fresh);outline-offset:3px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- Background clock ---------- */
.clock-wrap{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0;overflow:hidden}
.clock-wrap::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.75) 70%,#000 100%)}
.clock{width:min(118vh,140vw);height:auto;opacity:.42;transform:translateY(12%)}
.pendulum{transform-origin:0px 300px;animation:swing 3.6s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

/* ---------- Invitation gate ---------- */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:1.5rem}
.door{position:absolute;top:0;bottom:0;width:50.5%;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 2px,transparent 2px 46px),
  linear-gradient(180deg,#1c0005,#050001 60%,#1c0005);
  transition:transform 1.6s cubic-bezier(.7,0,.25,1)}
.door.left{left:0;border-right:2px solid var(--blood)}
.door.right{right:0;border-left:2px solid var(--blood)}
.door::before{content:"";position:absolute;top:8%;bottom:8%;left:12%;right:12%;border:1px solid rgba(196,0,28,.3);border-radius:46% 46% 4px 4px / 22% 22% 4px 4px}
.gate.open .door.left{transform:translateX(-102%)}
.gate.open .door.right{transform:translateX(102%)}
.gate.gone{display:none}
.letter{position:relative;z-index:2;max-width:32rem;width:100%;text-align:center;padding:2.5rem 2rem 2rem;
  background:linear-gradient(180deg,#e9d6bd,#d7bf9f);color:#1a0004;
  box-shadow:0 0 0 1px #6b4a2e,0 30px 80px rgba(0,0,0,.9),inset 0 0 60px rgba(90,40,10,.35);
  transition:opacity .6s,transform .6s}
.gate.open .letter{opacity:0;transform:scale(.94) translateY(20px)}
.seal{width:84px;height:84px;margin:-82px auto .75rem;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.letter h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,7vw,3.2rem);line-height:1;margin:0 0 .75rem;color:var(--blood)}
.letter p{margin:0 0 1rem;font-size:1.1rem}
.letter .fine{font-style:italic;font-size:1rem;color:#4a1a12}
.check{display:flex;gap:.6rem;align-items:flex-start;justify-content:center;text-align:left;margin:1.25rem 0;font-size:1.05rem;cursor:pointer}
.check input{width:1.2rem;height:1.2rem;accent-color:var(--blood);margin-top:.25rem;flex:none}
.gate-actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
.btn{font-family:var(--body);font-size:1.1rem;padding:.75rem 1.5rem;border:1px solid var(--blood);background:var(--blood);color:var(--bone);cursor:pointer;text-decoration:none;display:inline-block;transition:background .2s,color .2s}
.btn:hover{background:var(--fresh);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;background:var(--blood)}
.btn.ghost{background:transparent;color:inherit}
.btn.ghost:hover{background:rgba(196,0,28,.15)}
.refusal{min-height:1.6em;margin-top:1rem;font-style:italic;color:var(--blood)}

/* ---------- Layout ---------- */
main,header.top,footer{position:relative;z-index:1}
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.nav{max-width:72rem;margin:0 auto;display:flex;align-items:center;gap:1.5rem;padding:.7rem 1.25rem}
.brand{font-family:var(--display);font-size:1.5rem;color:var(--bone);text-decoration:none;white-space:nowrap}
.nav ul{display:flex;gap:1.25rem;list-style:none;margin:0 0 0 auto;padding:0;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a.link{color:var(--ash);text-decoration:none;white-space:nowrap;font-size:1.05rem}
.nav a.link:hover{color:var(--fresh)}
@media (max-width:720px){.nav{flex-direction:column;gap:.3rem;padding:.6rem 1rem}.nav ul{margin:0;max-width:100%;gap:1rem}}

section{padding:6rem 1.25rem}
.wrap{max-width:66rem;margin:0 auto}
.narrow{max-width:40rem}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,7vw,4.4rem);line-height:1;margin:0 0 1.25rem;color:var(--bone)}
h3{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.1;margin:0 0 .5rem}
.lede{font-size:1.3rem;font-style:italic;color:var(--ash);max-width:38rem}

/* hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:5rem 1.25rem 4rem}
.hero .when{font-style:italic;color:var(--ash);font-size:1.25rem;margin:0}
.title{font-family:var(--display);font-weight:400;line-height:.82;margin:.4rem 0 1rem;font-size:clamp(4rem,15vw,10.5rem);color:var(--bone);
  text-shadow:0 0 30px rgba(196,0,28,.55),0 2px 0 var(--blood)}
.title span{display:block}
.title .after{color:var(--crimson);text-shadow:0 0 40px rgba(227,16,46,.5)}
.hero .tag{font-size:1.35rem;max-width:34rem;margin:0 auto 2rem}
.countdown{display:flex;justify-content:center;gap:clamp(.75rem,3vw,2rem);margin:0 0 2.25rem}
.countdown div{min-width:4.2rem}
.countdown b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;color:var(--fresh)}
.countdown small{font-size:.95rem;color:var(--ash);font-style:italic}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.age{margin-top:2rem;font-size:.95rem;color:var(--ash)}

/* intro */
.intro{background:linear-gradient(180deg,transparent,rgba(20,0,4,.85) 20%,rgba(20,0,4,.85) 80%,transparent)}
.intro p{font-size:1.3rem}
.cast{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem;padding:0;list-style:none}
.cast li{border:1px solid var(--line);padding:.35rem 1rem;font-style:italic;color:var(--bone);background:rgba(0,0,0,.5)}

/* nights / schedule */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:2rem 0 0;overflow-x:auto}
.tab{flex:1;min-width:9rem;font-family:var(--body);background:transparent;border:0;border-bottom:3px solid transparent;color:var(--ash);padding:1rem .5rem;cursor:pointer;text-align:left}
.tab .d{display:block;font-family:var(--display);font-size:1.9rem;line-height:1;color:inherit}
.tab .s{font-style:italic;font-size:1rem}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--fresh)}
.tab:hover{color:var(--bone)}
.panel{background:rgba(0,0,0,.72);border:1px solid var(--line);border-top:0;padding:1rem 1.5rem 1.5rem}
.panel[hidden]{display:none}
.events{list-style:none;margin:0;padding:0}
.events li{display:grid;grid-template-columns:9.5rem 1fr;gap:1.25rem;padding:1.25rem 0;border-bottom:1px dashed rgba(196,0,28,.3)}
.events li:last-child{border-bottom:0}
.events time{font-family:var(--display);font-size:1.4rem;color:var(--fresh);line-height:1.2}
.events h4{margin:0 0 .25rem;font-size:1.3rem;font-weight:400;color:var(--bone)}
.events p{margin:0;color:var(--ash)}
.who{display:inline-block;margin-top:.5rem;font-size:.92rem;font-style:italic;color:var(--bone);border-left:2px solid var(--crimson);padding-left:.6rem}
.note{margin-top:1.25rem;font-style:italic;color:var(--ash);font-size:1rem}
@media (max-width:600px){.events li{grid-template-columns:1fr;gap:.3rem}}

/* masquerade */
.masq{text-align:center;background:radial-gradient(ellipse at center,rgba(74,0,9,.85),rgba(0,0,0,.9) 70%)}
.mask{width:min(320px,70vw);margin:0 auto 1.5rem;display:block}
.masq .facts{display:flex;justify-content:center;flex-wrap:wrap;gap:2.5rem;margin:2rem 0 0}
.masq .facts div b{display:block;font-family:var(--display);font-weight:400;font-size:2.2rem;color:var(--fresh);line-height:1.1}
.masq .facts div span{font-style:italic;color:var(--ash)}
.warning{margin:2.5rem auto 0;max-width:30rem;font-size:1.35rem;font-style:italic;color:var(--bone)}

/* anthology */
.anth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:3rem;align-items:center}
.book{aspect-ratio:3/4;max-width:300px;width:100%;margin:0 auto;background:linear-gradient(90deg,#2a0007 0 8%,#5a000d 8% 10%,#3a000a 10%);
  border:1px solid var(--blood);box-shadow:12px 16px 0 rgba(138,0,16,.35),0 30px 60px #000;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem 1.5rem 2rem 2.5rem;position:relative}
.book::after{content:"";position:absolute;inset:14px 14px 14px 34px;border:1px solid rgba(236,220,200,.25)}
.book strong{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;color:var(--bone)}
.book em{color:var(--ash);margin-top:.75rem;font-size:1rem}
.book .vol{margin-top:1.5rem;font-family:var(--display);color:var(--fresh);font-size:1.3rem}
@media (max-width:760px){.anth{grid-template-columns:1fr}}

/* tickets */
.tiers{display:flex;flex-direction:column;gap:1rem;margin-top:2.5rem}
.tier{border:1px solid var(--line);background:rgba(0,0,0,.78)}
.tier summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:1.25rem;align-items:center;padding:1.4rem 1.5rem}
.tier summary::-webkit-details-marker{display:none}
.tier .glyph{width:46px;height:46px;flex:none}
.tier .name{font-family:var(--display);font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1;display:block;color:var(--bone)}
.tier .rank{font-style:italic;color:var(--ash);font-size:1.05rem}
.chev{width:22px;height:22px;transition:transform .35s;color:var(--fresh)}
.tier[open] .chev{transform:rotate(180deg)}
.tier[open]{border-color:var(--crimson);box-shadow:0 0 40px rgba(196,0,28,.25)}
.tier.crown{border-width:2px}
.tier-body{padding:0 1.5rem 1.6rem calc(1.5rem + 46px + 1.25rem);animation:unfurl .45s ease}
@keyframes unfurl{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tier-body ul{margin:0 0 1.25rem;padding:0;list-style:none}
.tier-body li{padding:.45rem 0 .45rem 1.6rem;position:relative;border-bottom:1px solid rgba(196,0,28,.15)}
.tier-body li::before{content:"";position:absolute;left:0;top:.95rem;width:9px;height:12px;background:var(--crimson);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;clip-path:polygon(50% 0,100% 60%,100% 100%,0 100%,0 60%)}
.tier-body li strong{font-weight:400;color:var(--fresh)}
.tier-body .excl{color:var(--bone)}
.price{font-style:italic;color:var(--ash);margin:0 0 1rem}
.price .amt{font-family:var(--display);font-style:normal;font-size:2.2rem;color:var(--fresh);margin-right:.4rem;vertical-align:-.15em}
.tier .cost{font-family:var(--display);font-size:1.6rem;color:var(--fresh);white-space:nowrap}
@media (max-width:600px){.tier .cost{font-size:1.3rem}}
@media (max-width:600px){.tier summary{grid-template-columns:auto 1fr auto auto;gap:.7rem;padding:1.1rem}.tier .glyph{width:36px;height:36px}.tier-body{padding:0 1.1rem 1.4rem}}



/* ---------- MC reveal scroll ---------- */
.mc{padding:5rem 1rem}
.mc-stage{max-width:56rem;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,34rem) auto;justify-content:center;align-items:end;gap:clamp(.5rem,4vw,3rem)}
.mc-head{text-align:center;margin:0 auto 2.5rem;max-width:40rem}
.mc-head h2{margin-bottom:.5rem}
.candle{position:relative;width:clamp(34px,7vw,58px);display:flex;flex-direction:column;align-items:center;align-self:start;margin-top:1.5rem}
.candle .glow{position:absolute;top:-70px;left:50%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,60,.28),rgba(227,16,46,.08) 45%,transparent 70%);animation:glow 3s ease-in-out infinite alternate;pointer-events:none}
.candle .flame{width:42%;aspect-ratio:1/2.1;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 78%,#fff6d8 0 18%,#ffcf5a 34%,#ff7a1a 62%,rgba(227,16,46,0) 78%);transform-origin:50% 90%;animation:flicker 1.7s ease-in-out infinite;filter:blur(.3px)}
.candle.r .flame{animation-delay:-.8s}
.candle .wick{width:2px;height:8px;background:#1a0a04}
.candle .wax{width:100%;height:clamp(150px,30vw,250px);background:linear-gradient(90deg,#b9a68f,#efe3d1 35%,#f6ecdc 50%,#d6c4ad 80%,#a8937a);border-radius:4px 4px 2px 2px;position:relative}
.candle.tall .wax{height:clamp(190px,38vw,310px)}
.candle .wax::before{content:"";position:absolute;top:-2px;left:12%;width:22%;height:34%;background:#f3e8d8;border-radius:0 0 50% 50%}
.candle .wax::after{content:"";position:absolute;top:-2px;right:18%;width:16%;height:20%;background:#efe2cf;border-radius:0 0 50% 50%}
.candle .holder{width:170%;height:14px;background:linear-gradient(180deg,#3a0008,#120002);border:1px solid var(--blood);border-radius:50%}
.candle .base{width:70%;height:22px;background:linear-gradient(90deg,#1a0004,#4a0009,#1a0004);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(-1deg)}25%{transform:scale(.94,1.06) rotate(2deg)}50%{transform:scale(1.04,.95) rotate(-2deg)}75%{transform:scale(.97,1.04) rotate(1deg)}}
@keyframes glow{from{opacity:.75;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}

.scroll{display:flex;flex-direction:column;align-items:center}
.rod{position:relative;width:100%;height:26px;border-radius:13px;background:linear-gradient(180deg,#5a2a12,#2a1006 55%,#140703);box-shadow:0 6px 14px rgba(0,0,0,.7);z-index:2}
.rod::before,.rod::after{content:"";position:absolute;top:-5px;width:22px;height:36px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c4001c,#5a000a 70%)}
.rod::before{left:-14px}.rod::after{right:-14px}
.parchment{width:94%;overflow:hidden;max-height:0;transition:max-height 1.6s cubic-bezier(.45,0,.2,1);
  background:
    radial-gradient(ellipse at 15% 20%,rgba(120,70,20,.25),transparent 40%),
    radial-gradient(ellipse at 85% 75%,rgba(120,60,20,.3),transparent 45%),
    radial-gradient(ellipse at 60% 40%,rgba(255,240,210,.5),transparent 60%),
    linear-gradient(90deg,#c9a878,#ead6b0 12%,#f1e2c2 50%,#e6cfa4 88%,#bf9b68);
  box-shadow:inset 0 10px 18px rgba(60,30,5,.45),inset 0 -10px 18px rgba(60,30,5,.45);color:#2a0a04}
.scroll.open .parchment{max-height:44rem}
.parchment-inner{padding:2.25rem clamp(1.25rem,5vw,2.75rem) 2.5rem;text-align:center}
.parchment .decree{font-style:italic;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;color:#6b2a14;margin:0 0 .5rem}
.parchment h3{font-size:clamp(1.9rem,6vw,2.6rem);color:#7a000e;margin:0 0 1.25rem}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin:0 0 1.5rem}
.role-card{border-top:1px solid rgba(122,0,14,.5);border-bottom:1px solid rgba(122,0,14,.5);padding:1rem .5rem}
.role-card .title{font-family:var(--display);font-size:1.5rem;color:#2a0a04;margin:0;line-height:1.1;text-shadow:none}
.role-card .who-name{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.1rem);color:#7a000e;margin:.5rem 0 0;filter:blur(5px);user-select:none}
.role-card .soon{font-style:italic;font-size:.95rem;color:#6b2a14;margin:.25rem 0 0}
.parchment .sign{font-style:italic;margin:0}
@media (max-width:520px){.roles{grid-template-columns:1fr}}
.seal-btn{margin-top:-14px;position:relative;z-index:3;width:92px;height:92px;border:0;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 40% 35%,#d4001a,#8a0010 55%,#4a0009);color:#f3dcc0;font-family:var(--display);font-size:1rem;line-height:1.05;
  box-shadow:0 6px 16px rgba(0,0,0,.7),inset 0 0 0 5px rgba(0,0,0,.18),inset 0 0 0 8px rgba(255,255,255,.06);transition:transform .25s}
.seal-btn:hover{transform:scale(1.06) rotate(-4deg)}
.mc-hint{text-align:center;font-style:italic;color:var(--ash);margin-top:1rem}

/* ---------- Spotlights ---------- */
.spot{position:relative;overflow:hidden;background:rgba(0,0,0,.7)}
.spot::before{content:"";position:absolute;top:-10%;left:50%;width:70rem;height:120%;margin-left:-35rem;background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(236,220,200,.10) 20deg,rgba(236,220,200,.02) 40deg,transparent 60deg);pointer-events:none}
.spot .wrap{position:relative}
.spot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1.25rem;margin-top:2.5rem}
.spot-card{border:1px solid var(--line);background:rgba(10,0,2,.85);padding:1.5rem}
.spot-card svg{width:40px;height:40px;margin-bottom:.75rem}
.spot-card h3{font-size:1.7rem;color:var(--bone)}
.spot-card p{margin:0;color:var(--ash)}
.spot-feature{margin-top:2rem;border-left:3px solid var(--fresh);padding:1rem 1.5rem;background:linear-gradient(90deg,rgba(138,0,16,.35),transparent);font-size:1.3rem}

/* ---------- Panels ---------- */
.panels-sec{background:linear-gradient(180deg,transparent,rgba(20,0,4,.88) 15%,rgba(20,0,4,.88) 85%,transparent)}
.panels-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:3rem;align-items:start}
@media (max-width:760px){.panels-layout{grid-template-columns:1fr}}
.live{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--fresh);color:var(--bone);padding:.25rem .8rem;font-size:.95rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem}
.live i{width:10px;height:10px;border-radius:50%;background:var(--fresh);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(227,16,46,.7)}50%{opacity:.6;box-shadow:0 0 0 7px rgba(227,16,46,0)}}
.panel-days{list-style:none;margin:0;padding:0;border:1px solid var(--line);background:rgba(0,0,0,.6)}
.panel-days li{padding:1.25rem 1.5rem;border-bottom:1px dashed rgba(196,0,28,.35)}
.panel-days li:last-child{border-bottom:0}
.panel-days b{display:block;font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--fresh);line-height:1.1}
.panel-days span{font-style:italic;color:var(--ash)}


/* ---------- Anthology form ---------- */
.deadline{display:inline-block;border:1px solid var(--fresh);padding:.4rem 1rem;margin:.25rem 0 1rem;color:var(--bone)}
.deadline b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--fresh)}
.sub-form{margin-top:3rem;border:1px solid var(--line);background:rgba(0,0,0,.78);padding:clamp(1.25rem,4vw,2.25rem)}
.sub-form h3{color:var(--bone)}
.sub-form .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.25rem;margin-top:1.25rem}
.sub-form .full{grid-column:1/-1}
@media (max-width:620px){.sub-form .grid{grid-template-columns:1fr}}
.field label{display:block;font-size:1rem;color:var(--ash);margin-bottom:.3rem}
.field input,.field textarea{width:100%;font-family:var(--body);font-size:1.1rem;color:var(--bone);background:#0a0002;border:1px solid rgba(196,0,28,.5);padding:.65rem .8rem;border-radius:0}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--fresh);box-shadow:0 0 0 2px rgba(227,16,46,.25)}
.field textarea{min-height:7rem;resize:vertical}
.form-foot{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-top:1.25rem}
.form-foot small{color:var(--ash);font-style:italic;font-size:.95rem;flex:1;min-width:14rem}
.form-msg{margin-top:1rem;font-style:italic;color:var(--bone);min-height:1.5em}

/* ---------- Socials ---------- */
.socials{text-align:center}
.social-row{display:flex;flex-wrap:wrap;justify-content:center;gap:1.25rem;margin-top:2rem}
.social{display:flex;align-items:center;gap:1rem;text-decoration:none;border:1px solid var(--line);background:rgba(0,0,0,.7);padding:1rem 1.5rem;min-width:17rem;color:var(--bone);transition:border-color .2s,background .2s}
.social:hover{border-color:var(--fresh);background:rgba(138,0,16,.25);color:var(--bone)}
.social svg{width:40px;height:40px;flex:none}
.social span{text-align:left;line-height:1.3}
.social small{display:block;color:var(--ash);font-style:italic;font-size:.95rem}
.social b{font-weight:400;font-size:1.2rem}

/* ---------- Room block banner ---------- */
.room{position:relative;z-index:1;background:linear-gradient(180deg,#a3000f,#6e000b);border-top:2px solid #ff3348;border-bottom:2px solid #3a0006;text-align:center;padding:2.25rem 1.25rem;box-shadow:inset 0 0 80px rgba(0,0,0,.45)}
.room h2{font-size:clamp(2rem,6vw,3.2rem);color:#fff3e6;margin:0 0 .5rem;text-shadow:0 2px 0 #3a0006}
.room p{margin:0 auto;max-width:40rem;font-style:italic;font-size:1.2rem;color:#ffe2da}

/* ---------- Music toggle ---------- */
.music-btn{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:.5rem;font-family:var(--body);font-size:1rem;color:var(--bone);background:rgba(0,0,0,.85);border:1px solid var(--crimson);padding:.55rem .9rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.music-btn:hover{background:rgba(138,0,16,.6)}
.music-btn .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.music-btn .bars i{width:3px;background:var(--fresh);height:4px}
.music-btn[aria-pressed="true"] .bars i{animation:bar 1.1s ease-in-out infinite}
.music-btn .bars i:nth-child(2){animation-delay:-.4s}.music-btn .bars i:nth-child(3){animation-delay:-.75s}
@keyframes bar{0%,100%{height:3px}50%{height:14px}}
.music-btn[hidden]{display:none}

/* applications */
.apps{display:flex;flex-direction:column;gap:1rem;margin-top:2.5rem}
.apps .tier summary{grid-template-columns:auto 1fr auto}
.apps .tier-body p{margin:0 0 1.25rem;color:var(--ash)}

/* court */
.hosts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.5rem;margin-top:2rem}
.host{border-top:2px solid var(--crimson);padding-top:1rem}
.host .role{font-style:italic;color:var(--ash);margin:0}
.host .handle{color:var(--fresh)}

/* contact */
.contact{text-align:center;background:linear-gradient(180deg,transparent,rgba(74,0,9,.6))}
.contact .mail{font-size:clamp(1.15rem,3.6vw,1.6rem);word-break:break-word;display:inline-block;margin:.5rem 0 2rem}
.contact .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem}

footer{border-top:1px solid var(--line);padding:2.5rem 1.25rem 5.5rem;text-align:center;color:var(--ash);font-size:1rem;background:#000}
footer p{margin:.3rem 0}
footer .big{font-family:var(--display);font-size:1.8rem;color:var(--bone)}

/* ---------- Blood on click ---------- */
.blood{position:fixed;pointer-events:none;z-index:9999;left:0;top:0}
.drop{position:absolute;width:16px;height:22px;margin:-11px 0 0 -8px;animation:fall 1.3s cubic-bezier(.5,0,1,1) forwards}
.drop svg{width:100%;height:100%;filter:drop-shadow(0 0 3px rgba(227,16,46,.6))}
@keyframes fall{0%{transform:translateY(-6px) scale(.4);opacity:0}12%{transform:translateY(0) scale(1,1.1);opacity:1}80%{opacity:1}100%{transform:translateY(70px) scale(.85,1.35);opacity:0}}
.spat{position:absolute;border-radius:50%;background:var(--crimson);animation:spat .9s ease-out forwards}
@keyframes spat{0%{transform:translate(0,0) scale(1);opacity:.95}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.stain{position:absolute;border-radius:50%;background:radial-gradient(circle,#a3000f 0 55%,rgba(138,0,16,.0) 72%);width:18px;height:14px;margin:-7px 0 0 -9px;animation:stain 1.6s ease-out forwards}
@keyframes stain{0%{transform:scale(.2);opacity:.9}30%{transform:scale(1.15)}100%{transform:scale(1);opacity:0}}
</style>
</head>
